<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f8f4"><title>时间块 · 每日作息</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f8f4;color:#282d26;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible{outline:2px solid #446649;outline-offset:3px}header,main,footer{max-width:1600px;margin:auto;padding:0 clamp(20px,5vw,90px)}header{height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d9dcd3}.brand{font-size:19px;font-weight:670;letter-spacing:2px;display:flex;gap:12px;align-items:center}.mark{display:grid;grid-template-columns:repeat(2,8px);gap:2px}.mark i{width:8px;height:8px;background:#354c39}.mark i:last-child{background:#a8be9e}.date,.mono,time,.hour,.bounds{font-family:ui-monospace,"SFMono-Regular",monospace;font-variant-numeric:tabular-nums}.date{font-size:13px;color:#666e61}.focus{padding:clamp(45px,8vh,90px) 0;display:flex;align-items:end;justify-content:space-between}.eyebrow{display:flex;align-items:center;gap:9px;color:#53694e;font-size:13px;letter-spacing:1px}.dot{width:7px;height:7px;border-radius:50%;background:#698b5e}h1{font-weight:530;letter-spacing:-.045em;font-size:clamp(42px,6vw,88px);line-height:1.22;margin:15px 0 12px;overflow-wrap:anywhere}.range{color:#6a7266;font-size:16px}.clock{font-size:clamp(32px,5vw,74px);letter-spacing:-.065em;font-weight:350}.toolbar{border-top:1px solid #cbd0c5;padding:23px 0;display:flex;align-items:center;justify-content:space-between}h2{font-size:18px;margin:0;font-weight:600}
dialog button{border:1px solid #cdd1c6;border-radius:5px;background:transparent;padding:5px 11px}
.track{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));column-gap:clamp(1px,.2vw,4px)}
.card{min-width:0;padding:0;border:0;background:none;display:flex;align-items:center;flex-direction:column;gap:8px}
.hour{font-size:clamp(10px,1vw,14px);color:#697160}
.tile{display:block;width:100%;aspect-ratio:1;background:#e6eae1;border:1px solid #cbd3c4;border-radius:3px}
.card strong{writing-mode:vertical-rl;font-weight:500;line-height:1.1;font-size:clamp(11px,1.15vw,18px);max-height:min(26vh,150px);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.card.active{color:#425f34}.card.active .tile{background:#9ab87b;border-color:#658453}
.card:hover .tile{border-color:#68825d}
@media(max-width:600px){header,main{padding-inline:10px}.track{column-gap:1px}.tile{border-radius:1px}}
.hint{margin:26px 0;color:#70776b;font-size:13px}dialog{border:1px solid #cbd1c3;border-radius:10px;padding:26px;width:min(360px,90vw);background:#f8f8f4;color:inherit}dialog::backdrop{background:#27332144}dialog label{display:block;margin:20px 0 7px}input{width:100%;padding:10px;border:1px solid #adb8a4;border-radius:4px}dialog menu{padding:0;margin:20px 0 0;display:flex;justify-content:end;gap:8px}dialog .save{background:#354c39;color:white}@media(max-width:580px){header{height:64px}.focus{align-items:start;position:relative}.clock{position:absolute;top:38px;right:0;font-size:25px}.focus h1{font-size:42px;margin-top:24px}.toolbar{padding:18px 0}.overview{margin-top:24px}.controls button{padding:5px 9px}}
@media(max-height:500px){header{height:38px}.focus{padding:10px 0}.focus h1{font-size:26px;margin:4px 0}.toolbar{padding:8px 0}.hint{margin:8px 0}.clock{top:12px}.card strong{max-height:16vh}}</style></head><body><header><div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>时间块</div><span class="date" id="date"></span></header><main><section class="focus"><div><div class="eyebrow"><span class="dot"></span>此刻的安排</div><h1 id="activity"></h1><span class="range mono" id="range"></span></div><time class="clock" id="clock"></time></section><div class="toolbar"><h2>每日时间线</h2></div><section class="track" id="track" aria-label="24 小时时间线"></section><p class="hint">点击方块修改安排，每天按此重复。</p></main><dialog id="editor"><form id="form"><h2 id="editTitle"></h2><label for="entry">固定安排</label><input id="entry" maxlength="24" required autocomplete="off"><menu><button type="button" id="cancel">取消</button><button class="save">保存</button></menu></form></dialog>
<script>
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),stamp=n=>pad(n)+':00';
const plan=['睡眠','睡眠','睡眠','睡眠','睡眠','睡眠','起床洗漱','早餐','散步','专注工作','专注工作','处理事务','午餐','午休','专注工作','专注工作','整理收尾','运动','晚餐','自由时间','阅读','洗漱放松','准备入睡','睡眠'];
const storage='day-blocks.v1';
try{const saved=JSON.parse(localStorage.getItem(storage));if(Array.isArray(saved))plan.forEach((_,i)=>{if(typeof saved[i]==='string'&&saved[i].trim())plan[i]=saved[i].slice(0,24)})}catch{}
let current=-1,editing=0;
function edit(i){editing=i;$('editTitle').textContent=stamp(i)+' – '+stamp(i+1);$('entry').value=plan[i];$('editor').showModal();$('entry').select()}
const track = $('track');
plan.forEach((name, i) => {
  const card = document.createElement('button');
  card.className = 'card';
  const hour = document.createElement('span');
  hour.className = 'hour';
  hour.textContent = pad(i);
  const tile = document.createElement('span');
  tile.className = 'tile';
  const label = document.createElement('strong');
  label.textContent = name;
  card.append(hour, tile, label);
  card.onclick = () => edit(i);
  track.append(card);
});
function tick(){const d=new Date(),h=d.getHours();$('date').textContent=d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});$('clock').textContent=pad(h)+':'+pad(d.getMinutes());$('activity').textContent=plan[h];$('range').textContent=stamp(h)+' — '+stamp(h+1);if(current!==h){current=h;Array.from(track.children).forEach((card,i)=>card.classList.toggle('active',i===h))}}
$('cancel').onclick=()=>$('editor').close();$('entry').oninput=()=>$('entry').setCustomValidity('');
$('form').onsubmit=e=>{e.preventDefault();const v=$('entry').value.trim();if(!v){$('entry').setCustomValidity('请输入安排');$('entry').reportValidity();return}plan[editing]=v;try{localStorage.setItem(storage,JSON.stringify(plan))}catch{document.querySelector('.hint').textContent='浏览器无法保存，本次修改仅在当前页面有效。'}track.children[editing].querySelector('strong').textContent=v;$('editor').close();tick()};
tick();setInterval(tick,1000);
</script></body></html>
