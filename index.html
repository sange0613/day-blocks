<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f8f4"><title>时间块 · 每日作息</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f8f4;color:#282d26;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible{outline:2px solid #446649;outline-offset:3px}header,main,footer{max-width:1600px;margin:auto;padding:0 clamp(20px,5vw,90px)}header{height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d9dcd3}.brand{font-size:19px;font-weight:670;letter-spacing:2px;display:flex;gap:12px;align-items:center}.mark{display:grid;grid-template-columns:repeat(2,8px);gap:2px}.mark i{width:8px;height:8px;background:#354c39}.mark i:last-child{background:#a8be9e}.date,.mono,time,.hour,.bounds{font-family:ui-monospace,"SFMono-Regular",monospace;font-variant-numeric:tabular-nums}.date{font-size:13px;color:#666e61}.focus{padding:clamp(45px,8vh,90px) 0;display:flex;align-items:end;justify-content:space-between}.eyebrow{display:flex;align-items:center;gap:9px;color:#53694e;font-size:13px;letter-spacing:1px}.dot{width:7px;height:7px;border-radius:50%;background:#698b5e}h1{font-weight:530;letter-spacing:-.045em;font-size:clamp(42px,6vw,88px);line-height:1.22;margin:15px 0 12px;overflow-wrap:anywhere}.range{color:#6a7266;font-size:16px}.clock{font-size:clamp(32px,5vw,74px);letter-spacing:-.065em;font-weight:350}.toolbar{border-top:1px solid #cbd0c5;padding:23px 0;display:flex;align-items:center;justify-content:space-between}h2{font-size:18px;margin:0;font-weight:600}.controls{display:flex;gap:6px}.controls button,dialog button{border:1px solid #cdd1c6;border-radius:5px;background:transparent;padding:5px 11px}.controls button:hover,dialog button:hover{background:#e7ebdf}.controls button:disabled{opacity:.35}.controls button:first-child{font-size:13px}.track{display:flex;overflow:auto;gap:8px;padding:4px 2px 12px;scrollbar-width:thin;scrollbar-color:#cbd1c5 transparent}.slot{flex:0 0 clamp(126px,11.8vw,184px);position:relative;padding-top:27px}.slot:before{content:"";height:1px;background:#b9c0b3;position:absolute;left:0;right:-8px;top:10px}.slot:last-child:before{right:0}.slot:after{content:"";width:1px;background:#929e89;height:9px;position:absolute;top:6px;left:0}.card{width:100%;aspect-ratio:1;border:1px solid #d0d5c9;background:#fdfdfa;border-radius:6px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;padding:15px}.card:hover{border-color:#849679}.card.active{background:#d9e8be;border-color:#8ea576}.hour{font-size:14px;color:#697160}.card strong{font-weight:550;font-size:clamp(16px,1.35vw,21px);overflow-wrap:anywhere;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}.active .hour:after{content:"";display:inline-block;background:#527449;width:6px;height:6px;border-radius:50%;margin:0 0 2px 7px}.overview{margin:30px 0 0;display:grid;grid-template-columns:repeat(24,1fr);gap:3px}.overview button{background:transparent;border:0;padding:6px 0}.overview button:before{content:"";display:block;height:6px;border-radius:1px;background:#d9ddd3}.overview .past:before{background:#adb8a4}.overview .now:before{background:#56734b}.overview button:hover:before{background:#7c916f}.bounds{display:flex;justify-content:space-between;color:#858c80;font-size:11px}.hint{margin:26px 0;color:#70776b;font-size:13px}dialog{border:1px solid #cbd1c3;border-radius:10px;padding:26px;width:min(360px,90vw);background:#f8f8f4;color:inherit}dialog::backdrop{background:#27332144}dialog label{display:block;margin:20px 0 7px}input{width:100%;padding:10px;border:1px solid #adb8a4;border-radius:4px}dialog menu{padding:0;margin:20px 0 0;display:flex;justify-content:end;gap:8px}dialog .save{background:#354c39;color:white}@media(max-width:580px){header{height:64px}.focus{align-items:start;position:relative}.clock{position:absolute;top:38px;right:0;font-size:25px}.focus h1{font-size:42px;margin-top:24px}.toolbar{padding:18px 0}.overview{margin-top:24px}.controls button{padding:5px 9px}}
</style></head><body><header><div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>时间块</div><span class="date" id="date"></span></header><main><section class="focus"><div><div class="eyebrow"><span class="dot"></span>此刻的安排</div><h1 id="activity"></h1><span class="range mono" id="range"></span></div><time class="clock" id="clock"></time></section><div class="toolbar"><h2>每日时间线</h2><div class="controls"><button id="today">回到此刻</button><button id="left" aria-label="查看更早的时段">←</button><button id="right" aria-label="查看更晚的时段">→</button></div></div><section class="track" id="track" aria-label="24 小时时间线"></section><nav class="overview" id="overview" aria-label="跳转至小时"></nav><div class="bounds"><span>00:00</span><span>24:00</span></div><p class="hint">点击方块修改安排，每天按此重复。</p></main><dialog id="editor"><form id="form"><h2 id="editTitle"></h2><label for="entry">固定安排</label><input id="entry" maxlength="24" required autocomplete="off"><menu><button type="button" id="cancel">取消</button><button class="save">保存</button></menu></form></dialog>
<script>
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),stamp=n=>pad(n)+':00';
const plan=['睡眠','睡眠','睡眠','睡眠','睡眠','睡眠','起床洗漱','早餐','散步','专注工作','专注工作','处理事务','午餐','午休','专注工作','专注工作','整理收尾','运动','晚餐','自由时间','阅读','洗漱放松','准备入睡','睡眠'];
const storage='day-blocks.v1';
try{const saved=JSON.parse(localStorage.getItem(storage));if(Array.isArray(saved))plan.forEach((_,i)=>{if(typeof saved[i]==='string'&&saved[i].trim())plan[i]=saved[i].slice(0,24)})}catch{}
let current=-1,editing=0;
function jump(i,smooth=true){const slot=$('track').children[i],track=$('track');track.scrollTo({left:track.scrollLeft+slot.getBoundingClientRect().left-track.getBoundingClientRect().left-(track.clientWidth-slot.offsetWidth)/2,behavior:smooth&&!matchMedia('(prefers-reduced-motion: reduce)').matches?'smooth':'instant'})}
function edit(i){editing=i;$('editTitle').textContent=stamp(i)+' – '+stamp(i+1);$('entry').value=plan[i];$('editor').showModal();$('entry').select()}
plan.forEach((name,i)=>{const slot=document.createElement('div'),card=document.createElement('button'),hour=document.createElement('span'),label=document.createElement('strong'),nav=document.createElement('button');slot.className='slot';card.className='card';hour.className='hour';hour.textContent=stamp(i);label.textContent=name;card.append(hour,label);card.onclick=()=>edit(i);slot.append(card);$('track').append(slot);nav.setAttribute('aria-label','查看 '+stamp(i));nav.title=stamp(i);nav.onclick=()=>jump(i);$('overview').append(nav)});
function tick(){const d=new Date(),h=d.getHours();$('date').textContent=d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});$('clock').textContent=pad(h)+':'+pad(d.getMinutes());$('activity').textContent=plan[h];$('range').textContent=stamp(h)+' — '+stamp(h+1);if(current!==h){current=h;Array.from($('track').children).forEach((s,i)=>{s.firstChild.classList.toggle('active',i===h);$('overview').children[i].className=i===h?'now':i<h?'past':''});jump(h,false)}}
$('today').onclick=()=>jump(current);const track=$('track');function edges(){$('left').disabled=track.scrollLeft<=1;$('right').disabled=track.scrollLeft+track.clientWidth>=track.scrollWidth-2}track.onscroll=edges;window.addEventListener('resize',edges);
for(const [id,sign] of [['left',-1],['right',1]])$(id).onclick=()=>track.scrollBy({left:sign*track.clientWidth*.75,behavior:'smooth'});
$('cancel').onclick=()=>$('editor').close();$('entry').oninput=()=>$('entry').setCustomValidity('');
$('form').onsubmit=e=>{e.preventDefault();const v=$('entry').value.trim();if(!v){$('entry').setCustomValidity('请输入安排');$('entry').reportValidity();return}plan[editing]=v;try{localStorage.setItem(storage,JSON.stringify(plan))}catch{document.querySelector('.hint').textContent='浏览器无法保存，本次修改仅在当前页面有效。'}track.children[editing].querySelector('strong').textContent=v;$('editor').close();tick()};
tick();edges();setInterval(tick,1000);
</script></body></html>
