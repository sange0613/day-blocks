<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f8f4"><title>时间块 · 每日作息</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f8f4;color:#282d26;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible{outline:2px solid #446649;outline-offset:3px}header,main,footer{max-width:1600px;margin:auto;padding:0 clamp(20px,5vw,90px)}header{height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d9dcd3}.brand{font-size:19px;font-weight:670;letter-spacing:2px;display:flex;gap:12px;align-items:center}.mark{display:grid;grid-template-columns:repeat(2,8px);gap:2px}.mark i{width:8px;height:8px;background:#354c39}.mark i:last-child{background:#a8be9e}.date,.mono,time,.hour,.bounds{font-family:ui-monospace,"SFMono-Regular",monospace;font-variant-numeric:tabular-nums}.date{font-size:13px;color:#666e61}.focus{padding:clamp(45px,8vh,90px) 0;display:flex;align-items:end;justify-content:space-between}.eyebrow{display:flex;align-items:center;gap:9px;color:#53694e;font-size:13px;letter-spacing:1px}.dot{width:7px;height:7px;border-radius:50%;background:#698b5e}h1{font-weight:530;letter-spacing:-.045em;font-size:clamp(42px,6vw,88px);line-height:1.22;margin:15px 0 12px;overflow-wrap:anywhere}.range{color:#6a7266;font-size:16px}.clock{font-size:clamp(32px,5vw,74px);letter-spacing:-.065em;font-weight:350}.toolbar{border-top:1px solid #cbd0c5;padding:23px 0;display:flex;align-items:center;justify-content:space-between}h2{font-size:18px;margin:0;font-weight:600}
dialog button{border:1px solid #cdd1c6;border-radius:5px;background:transparent;padding:5px 11px}

.track{container-type:inline-size;position:relative;min-height:30px;align-items:center;background:linear-gradient(#cad1c4,#cad1c4) center/100% 1px no-repeat}
.block{position:absolute;top:50%;transform:translateY(-50%);padding:0;height:calc(100cqw / 48);background:#a6b89d;border:0;border-radius:2px;min-width:0}
.block.active{background:#496941}
.scale{position:relative;isolation:isolate;font:11px ui-monospace,monospace;color:#687261;margin:6px 0}
.scale span{position:absolute;width:max-content;white-space:nowrap;background:#f8f8f4;padding:2px 0}
.scale .scheduled{font-weight:650;color:#394e35}
.scale span::after{content:"";position:absolute;left:var(--anchor);top:100%;height:var(--stem);border-left:1px solid #a6b39e;z-index:-1}
.agenda{position:relative}
.item{position:absolute;width:max-content;max-width:min(12em,100%);display:grid;gap:2px;padding:3px 4px;border:0;background:#f8f8f4;text-align:center;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.item time{font-size:10px;color:#687261}.item.active{color:#496941;font-weight:650}
.item::before{content:"";position:absolute;left:var(--anchor);bottom:100%;height:var(--stem);border-left:1px solid #afbaa7;pointer-events:none;z-index:-1}
.agenda{isolation:isolate}
#add,dialog button{border:1px solid #cdd1c6;background:#fdfefa;padding:6px 11px;border-radius:5px}
select{font:inherit;width:100%;padding:8px;background:white;border:1px solid #adb8a4;border-radius:4px}
#remove{margin-right:auto}
@media(max-width:600px){header,main{padding-inline:14px}.block{border-radius:1px}.item{font-size:12px;max-width:min(8em,100%)}.focus{padding:26px 0}#activity{font-size:34px}}
.hint{margin:26px 0;color:#70776b;font-size:13px}dialog{border:1px solid #cbd1c3;border-radius:10px;padding:26px;width:min(360px,90vw);background:#f8f8f4;color:inherit}dialog::backdrop{background:#27332144}dialog label{display:block;margin:20px 0 7px}input{width:100%;padding:10px;border:1px solid #adb8a4;border-radius:4px}dialog menu{padding:0;margin:20px 0 0;display:flex;justify-content:end;gap:8px}dialog .save{background:#354c39;color:white}@media(max-width:580px){header{height:64px}.focus{align-items:start;position:relative}.clock{position:absolute;top:38px;right:0;font-size:25px}.focus h1{font-size:42px;margin-top:24px}.toolbar{padding:18px 0}.overview{margin-top:24px}.controls button{padding:5px 9px}}
@media(max-height:500px){header{height:38px}.focus{padding:10px 0}.focus h1{font-size:26px;margin:4px 0}.toolbar{padding:8px 0}.hint{margin:8px 0}.clock{top:12px}.card strong{max-height:16vh}}.header-actions{display:flex;align-items:center;gap:clamp(8px,2vw,24px)}.times{display:flex;gap:12px}.times label{min-width:0;flex:1}.times input{margin-top:7px;font-variant-numeric:tabular-nums}#overlap{font-size:13px;color:#655236;line-height:1.5}</style></head><body><header><div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>时间块</div><div class="header-actions"><span class="date" id="date"></span><button id="add">＋ 添加安排</button></div></header><main><section class="focus"><div><div class="eyebrow"><span class="dot"></span>此刻的安排</div><h1 id="activity"></h1><span class="range mono" id="range"></span></div><time class="clock" id="clock"></time></section><div class="toolbar"><h2>每日时间线</h2></div><div class="scale" id="scale"></div><section class="track" id="track" aria-label="24 小时时间线"></section><div id="agenda" class="agenda"></div><p class="hint" id="hint"></p></main><dialog id="editor"><form id="form"><h2 id="editTitle"></h2><div id="manage"><label for="existing">选择安排</label><select id="existing"></select></div><div class="times"><label>开始时间<input id="start" placeholder="09:10" maxlength="5" required></label><label>结束时间<input id="end" placeholder="10:45" maxlength="5" required></label></div><p id="overlap" role="status" hidden></p><label for="entry">固定安排</label><input id="entry" maxlength="24" required autocomplete="off"><menu><button type="button" id="remove">删除</button><button type="button" id="cancel">取消</button><button class="save">保存</button></menu></form></dialog>
<script>
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const stamp = i => pad(Math.floor(i / 60)) + ':' + pad(i % 60);
const range = (start, end) => stamp(start) + ' — ' + stamp(end);
const key = 'day-blocks.minutes.v1';
let plan = {};
try {
  const saved = JSON.parse(localStorage.getItem(key));
  if (saved && typeof saved === 'object') plan = saved;
  else {
    const ranges = JSON.parse(localStorage.getItem('day-blocks.ranges.v1'));
    if (ranges) {
      for (const [slot, activity] of Object.entries(ranges)) {
        plan[Number(slot)*30] = {name:activity.name, end:activity.end*30};
      }
    } else {
    const halfHours = JSON.parse(localStorage.getItem('day-blocks.half-hours.v1'));
    if (halfHours) {
      for (let i = 0; i < 48; i++) {
        if (typeof halfHours[i] === 'string' && halfHours[i]) plan[i*30] = {name:halfHours[i], end:(i+1)*30};
      }
    } else {
    // Keep edits from the hourly version. Untouched sample activities start empty.
    const previous = JSON.parse(localStorage.getItem('day-blocks.v1'));
    const samples = ['睡眠','睡眠','睡眠','睡眠','睡眠','睡眠','起床洗漱','早餐','散步','专注工作','专注工作','处理事务','午餐','午休','专注工作','专注工作','整理收尾','运动','晚餐','自由时间','阅读','洗漱放松','准备入睡','睡眠'];
    if (Array.isArray(previous)) samples.forEach((sample,h) => {
      if (typeof previous[h] === 'string' && previous[h].trim() && previous[h] !== sample)
        plan[h*60] = {name:previous[h], end:(h+1)*60};
    });
    }
    }
  }
} catch {}
let now = -1;
function tick() {
  const d = new Date();
  const slot = d.getHours()*60 + d.getMinutes();
  $('date').textContent = d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});
  $('clock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
  const start = Object.keys(plan).map(Number).find(i => i <= slot && slot < plan[i].end);
  const activity = plan[start];
  $('activity').textContent = activity?.name || '暂无安排';
  $('range').textContent = activity ? range(start, activity.end) : '';
  if (now !== slot) { now = slot; render(); }
}
function layoutLabels(area, above) {
  const width = area.clientWidth;
  const lanes = [];
  const positions = [];
  for (const item of area.children) {
    const anchor = Number(item.dataset.slot) * width / 1440;
    const left = Math.max(0, Math.min(anchor - item.offsetWidth / 2, width - item.offsetWidth));
    let lane = lanes.findIndex(row => row.end + 4 <= left);
    if (lane < 0) { lane = lanes.length; lanes.push({end:0, height:0}); }
    lanes[lane].end = left + item.offsetWidth;
    lanes[lane].height = Math.max(lanes[lane].height, item.offsetHeight);
    positions.push({item, left, anchor, lane});
  }
  let height = 0;
  for (const row of lanes) { row.top = height; height += row.height + 4; }
  for (const {item, left, anchor, lane} of positions) {
    const top = lanes[lane].top;
    item.style.left = left + 'px';
    item.style[above ? 'bottom' : 'top'] = top + 'px';
    item.style.setProperty('--anchor', (anchor-left) + 'px');
    item.style.setProperty('--stem', (top+4) + 'px');
  }
  area.style.height = height + 'px';
}
function positionLabels() {
  layoutLabels($('scale'), true);
  layoutLabels($('agenda'), false);
}
window.addEventListener('resize', positionLabels);
function render() {
  const scale = $('scale');
  scale.replaceChildren();
  const starts = Object.keys(plan).map(Number);
  const marks = [...new Set([0, 360, 720, 1080, 1440, ...starts])].sort((a,b) => a-b);
  for (const i of marks) {
    const tick = document.createElement('span');
    tick.dataset.slot = i;
    tick.textContent = plan[i] ? stamp(i) + '–' + stamp(plan[i].end) : stamp(i);
    if (plan[i]) tick.className = 'scheduled';
    scale.append(tick);
  }
  $('track').replaceChildren();
  $('agenda').replaceChildren();
  for (const i of starts) {
    const block = document.createElement('span');
    block.className = 'block' + (i <= now && now < plan[i].end ? ' active' : '');
    block.style.left = (i / 1440 * 100) + '%';
    block.style.width = ((plan[i].end-i) / 1440 * 100) + '%';
    block.setAttribute('aria-hidden', 'true');
    $('track').append(block);
    const item = document.createElement('span');
    item.className = 'item' + (i <= now && now < plan[i].end ? ' active' : '');
    item.textContent = plan[i].name;
    item.dataset.slot = (i + plan[i].end) / 2;
    $('agenda').append(item);
  }
  positionLabels();
  $('hint').textContent = $('track').childElementCount ? '' : '添加第一项安排，它会出现在对应的时段。';
}
function readTime(id) {
  const text = $(id).value.trim().replace('：', ':');
  if (id === 'end' && text === '24:00') return 1440;
  const match = /^([01]?\d|2[0-3]):([0-5]\d)$/.exec(text);
  return match ? Number(match[1])*60 + Number(match[2]) : NaN;
}
function affectedStarts(start, end) {
  return Object.keys(plan).filter(i =>
    i !== $('existing').value && Number(i) < end && start < plan[i].end);
}
function validateTimes() {
  const start = readTime('start'), end = readTime('end');
  $('start').setCustomValidity(Number.isFinite(start) ? '' : '请输入开始时间，例如 09:10');
  $('end').setCustomValidity(!Number.isFinite(end) ? '请输入结束时间，例如 10:45 或 24:00' :
    end <= start ? '结束时间须晚于开始时间' : '');
  const affected = start < end ? affectedStarts(start, end) : [];
  $('overlap').hidden = affected.length === 0;
  $('overlap').textContent = affected.length ? '保存将替换以下时段：' + affected.map(i =>
    range(Math.max(start, Number(i)), Math.min(end, plan[i].end)) + ' ' + plan[i].name
  ).join('、') : '';
}
function loadSelection() {
  const selected = $('existing').value;
  const activity = plan[selected];
  const start = activity ? Number(selected) : now;
  $('start').value = stamp(start);
  $('end').value = stamp(activity?.end ?? Math.min(start+30, 1440));
  $('entry').value = activity?.name || '';
  $('entry').setCustomValidity('');
  $('remove').hidden = !activity;
  $('editTitle').textContent = activity ? '修改安排' : '添加安排';
  validateTimes();
}
function openEditor() {
  const existing = $('existing');
  existing.replaceChildren(new Option('新安排',''));
  for (const [start, activity] of Object.entries(plan)) {
    existing.add(new Option(range(Number(start), activity.end) + ' · ' + activity.name, start));
  }
  $('manage').hidden = existing.length === 1;
  loadSelection();
  $('editor').showModal();
}
$('existing').onchange = loadSelection;
$('start').oninput = $('end').oninput = validateTimes;
function save() {
  $('editor').close(); render(); tick();
  try { localStorage.setItem(key, JSON.stringify(plan)); }
  catch { $('hint').textContent = '浏览器无法保存，本次修改仅在当前页面有效。'; }
}
$('add').onclick = openEditor;
$('cancel').onclick = () => $('editor').close();
$('remove').onclick = () => { delete plan[$('existing').value]; save(); };
$('entry').oninput = () => $('entry').setCustomValidity('');
$('form').onsubmit = e => {
  e.preventDefault();
  const value = $('entry').value.trim();
  if (!value) { $('entry').setCustomValidity('请输入安排'); $('entry').reportValidity(); return; }
  validateTimes();
  if (!$('form').reportValidity()) return;
  const start = readTime('start'), end = readTime('end');
  delete plan[$('existing').value];
  for (const i of affectedStarts(start, end)) {
    const previous = plan[i];
    delete plan[i];
    if (Number(i) < start) plan[i] = {name:previous.name, end:start};
    if (previous.end > end) plan[end] = previous;
  }
  plan[start] = {name:value, end};
  save();
};
tick(); setInterval(tick,1000);
</script></body></html>
